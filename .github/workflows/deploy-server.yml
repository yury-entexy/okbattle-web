# Builds the ad-room server and deploys it to Cloud Run (project sound-guess-95889).
# Needs the repository secrets GCP_SA_KEY (a service account key with the roles Cloud Run Admin,
# Artifact Registry Admin and Service Account User) and FIREBASE_API_KEY (the site's
# NEXT_PUBLIC_FIREBASE_API_KEY). Until both are set the job only prints a notice.
name: Deploy ad-room server

on:
  push:
    branches: [main]
    paths:
      - server/**
      - src/lib/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/deploy-server.yml
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  PROJECT: sound-guess-95889
  REGION: europe-west1
  SERVICE: okbattle-ad-rooms
  REPO: okbattle

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$FIREBASE_API_KEY" ]; then
            echo "::notice::GCP_SA_KEY or FIREBASE_API_KEY is not set yet; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: google-github-actions/auth@v2
        if: steps.secrets.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.secrets.outputs.ready == 'true'

      - name: Build and push the image
        if: steps.secrets.outputs.ready == 'true'
        run: |
          gcloud artifacts repositories describe "$REPO" --project "$PROJECT" --location "$REGION" >/dev/null 2>&1 ||
            gcloud artifacts repositories create "$REPO" --project "$PROJECT" --location "$REGION" --repository-format docker
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/$REPO/$SERVICE:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        if: steps.secrets.outputs.ready == 'true'
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          # One always-on instance: the rooms live in its memory, so it must neither scale out nor sleep.
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE" \
            --min-instances 1 --max-instances 1 --no-cpu-throttling --cpu 1 --memory 512Mi \
            --no-allow-unauthenticated \
            --set-env-vars "NEXT_PUBLIC_FIREBASE_API_KEY=$FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT,SITE_URL=https://okbattle-web.vercel.app/"
